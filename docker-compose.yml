services:
  postgres:
    image: postgres:17-alpine
    container_name: dashboard-postgres-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5430:5430"
    volumes:
      - asaas_postgres_data:/var/lib/postgresql/data
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard_user -d dashboard_webhooks_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: dashboard-redis-prod
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - asaa_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: dashboard-redis-ui-prod
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - dashboard-network

  backend:
    platform: linux/amd64
    build: ./backend
    container_name: dashboard-backend
    env_file:
      - ./backend/.env
    ports:
      - "3333:3333"
    depends_on:
      - postgres
      - redis
    networks:
      - dashboard-network

  frontend:
    build: ./frontend
    container_name: dashboard-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`app.watidy.com.br`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=3004"
    ports:
      - "3004:3004"
    depends_on:
      - backend
    networks:
      - dashboard-network
      - web

volumes:
  asaas_postgres_data:
  asaa_redis_data:

networks:
  dashboard-network:
    driver: bridge
  web:
    external: true