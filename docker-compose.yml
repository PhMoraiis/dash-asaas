services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5430:5432"
    volumes:
      - asaas_postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard_user -d dashboard_webhooks_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - asaa_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - dokploy-network

  backend:
    platform: linux/amd64
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - dokploy-network
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.api.rule=Host(`api.manyflux.com.br`)"
    #   - "traefik.http.routers.api.entrypoints=websecure"
    #   - "traefik.http.routers.api.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.api.loadbalancer.server.port=8080"
    environment:
      # URLs compostas
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}

      # Redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      # PostgreSQL
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}

      # Cookies
      COOKIE_SECRET: ${COOKIE_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}

      # Server
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      API_VERSION: ${API_VERSION}

      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN}

      # Asaas
      ASAAS_WEBHOOK_SECRET: ${ASAAS_WEBHOOK_SECRET}

      # Integrações externas
      EXTERNAL_API_URL: ${EXTERNAL_API_URL}
      EXTERNAL_API_TOKEN: ${EXTERNAL_API_TOKEN}
      RESEND_API_URL: ${RESEND_API_URL}

      # Frontend
      FRONTEND_URL: ${FRONTEND_URL}

      # Admin
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}


  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3636:3000"
    depends_on:
      - backend
    networks:
      - dokploy-network
    environment:
      NEXT_PUBLIC_JWT_SECRET: ${NEXT_PUBLIC_JWT_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.app.rule=Host(`app.manyflux.com.br`)"
    #   - "traefik.http.routers.app.entrypoints=websecure"
    #   - "traefik.http.routers.app.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.app.loadbalancer.server.port=3000"

volumes:
  asaas_postgres_data:
  asaa_redis_data:

networks:
  dokploy-network:
    external: true
